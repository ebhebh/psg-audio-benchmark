# =============================================================================
# Stage 8 - Airflow-incremental paired nested-CV comparison config.
# -----------------------------------------------------------------------------
# This file is the PRE-REGISTERED source of truth for the airflow-incremental
# comparison. Every feature set, airflow allow-list, model family, hyper-parameter
# grid, random seed, inner-selection rule and threshold rule is declared here and
# copied verbatim (as a resolved YAML + run metadata) into every run-dir.
#
# Hard rules (mirror the Stage-7 discipline and the Stage-8 prompt):
#   * Consumes ONLY the frozen, approved v2 patient split (the SAME split Stage-7
#     used). v1 / unapproved / signature-mismatched splits are rejected -- never
#     a silent fallback. The 34 airflow-eligible patients INHERIT their v2
#     outer/inner assignments; no independent / random / re-balanced split.
#   * Patient-level nested CV: 5 outer folds x 4 inner folds. No window random
#     split, no patient crosses an outer fold, no outer-test patient in any inner
#     fold. The split is INHERITED, never rebuilt.
#   * Two feature sets are built on the IDENTICAL airflow-eligible window set:
#       - core_restricted  : the 16 HR+SpO2 statistics (Stage-7 allow-list);
#       - airflow_enhanced : those 16 + the 11 airflow statistics (27 columns).
#     Their window/patient/label/fold membership MUST be identical (asserted).
#   * Features are ONLY the allow-listed statistics. IDs, time, quality/coverage,
#     modal-availability, label, annotation, awake, sleep stage and AUDIO never
#     enter either estimator. Airflow is allowed ONLY in airflow_enhanced.
#   * Every preprocessor / class weight / hyper-parameter / threshold is fitted
#     ONLY on the matching outer/inner TRAIN partition. Outer-test never selects
#     models, feature sets or thresholds, and is never post-calibrated.
#   * The main comparison is FIXED: logistic_regression
#     airflow_enhanced - core_restricted, paired same-window patient-cluster
#     bootstrap. HGB is exploratory and never seizes the main conclusion.
#   * task = "window-level dataset-scored respiratory-event airflow-incremental
#     paired within-cohort comparison"; NOT a gain over the Stage-7 50-patient
#     cohort, NOT clinical, NOT deployable. Audio BLOCKED.
# =============================================================================

meta:
  stage: stage8
  task_name: "window-level dataset-scored respiratory-event airflow-incremental paired within-cohort comparison"
  cohort: airflow_eligible_internal
  split_balance_version: split_balance_v2
  non_clinical_note: >
    Single public dataset, patient-level INTERNAL cross-validation only on the
    34-patient airflow-eligible sub-cohort. This is a retrospective PSG-anchored
    CSV benchmark of the airflow feature INCREMENT over HR+SpO2 WITHIN the same
    patients/windows -- NOT a clinical/diagnostic/deployment claim, NOT a gain
    over the Stage-7 50-patient main cohort (different population), and NOT
    generalizable to audio. HGB is exploratory only. Audio remains BLOCKED.

# ---------------------------------------------------------------------------
# Input provenance gate. Stage 8 FIRST re-runs the full Stage-7 v2 gate (so the
# v2 signature / cohort / folds / lineage are verified), THEN re-derives the
# airflow-eligible cohort (HR & SpO2 & airflow all available, positive/negative
# windows) and asserts the airflow patients inherit the v2 folds.
# ---------------------------------------------------------------------------
gate:
  require_license_passed: true
  license_passed_relpath: reports/data_audit/license_gate_passed.md
  require_latest_run_v2: true
  require_approval_status: approved_for_modeling
  reject_v1: true
  reject_unapproved: true
  reject_signature_mismatch: true
  verify_v2_file_sha256: true
  verify_assignment_sha256: true
  verify_patient_set_sha256: true
  verify_lineage_run_ids: true
  runtime_reverify_cohort: true        # recompute core + airflow counts; compare to signature
  runtime_reverify_airflow_cohort: true # re-derive the 34-patient airflow cohort at runtime
  require_airflow_feature_file: true    # airflow_window_features.parquet must exist
  airflow_inherits_v2_folds: true       # 0 patient/fold mismatch vs core v2
  forbidden_hardcode_counts: true
  # Expected airflow cohort fingerprint is read FROM RUNTIME RE-DERIVATION and
  # cross-checked against the v2 signature lineage; never hard-coded here.

# ---------------------------------------------------------------------------
# Feature sets (both built on the IDENTICAL airflow-eligible window set).
# ---------------------------------------------------------------------------
features:
  join_key: window_id
  sets:
    core_restricted:
      role: comparator_baseline
      modalities: [heart_rate, spo2]
      prefix: {heart_rate: hr_, spo2: spo2_}
      statistics: [mean, median, std_ddof1, min, max, range, iqr, slope_per_second]
    airflow_enhanced:
      role: increment_under_test
      modalities: [heart_rate, spo2, airflow]
      prefix: {heart_rate: hr_, spo2: spo2_, airflow: airflow_}
      heart_rate_statistics: [mean, median, std_ddof1, min, max, range, iqr, slope_per_second]
      spo2_statistics: [mean, median, std_ddof1, min, max, range, iqr, slope_per_second]
      airflow_statistics: [mean, median, std_ddof1, min, max, range, iqr, slope_per_second, rms, zero_crossing_count, zero_crossing_rate]
  forbid_categories:
    - ids
    - time
    - quality_coverage
    - modal_availability
    - label
    - annotation
    - awake
    - sleep
    - audio
    - full_cohort_fit
    # NOTE: "airflow" is NOT a forbidden category here -- airflow STATISTICS are
    # admissible in airflow_enhanced. Availability/quality airflow columns are
    # still rejected by the exact allow-list + explicit forbidden_columns.

# ---------------------------------------------------------------------------
# Label definition (identical to Stage 7).
# ---------------------------------------------------------------------------
label:
  column: binary_event_label
  values: {negative: 0, positive: 1}
  source: stage4_window_index
  note: "dataset-scored respiratory-event research label; NOT a clinical diagnosis."

# ---------------------------------------------------------------------------
# Nested CV structure (INHERITED from the frozen v2 split; never rebuilt).
# ---------------------------------------------------------------------------
nested_cv:
  outer_n_folds: 5
  inner_n_folds: 4
  unit: patient
  inherits_split: true
  rebuilds_split: false
  window_random_split: false
  outer_assignment_source: splits/outer_patient_folds_core_v2.csv
  inner_assignment_source: splits/inner_patient_folds_core_v2.parquet

# ---------------------------------------------------------------------------
# Pre-specified model families (Stage-8 subset; fixed roles; no outer-test
# cherry-pick of model OR feature set). Grids identical to Stage 7.
# ---------------------------------------------------------------------------
models:
  logistic_regression:
    role: primary
    class: sklearn.linear_model.LogisticRegression
    pipeline:
      - {class: sklearn.impute.SimpleImputer, params: {strategy: median}}
      - {class: sklearn.preprocessing.StandardScaler, params: {}}
      - {class: sklearn.linear_model.LogisticRegression,
         params: {solver: lbfgs, max_iter: 2000, random_state: 20250714}}
    param_grid:
      logisticregression__C: [0.1, 1.0, 10.0]
      logisticregression__class_weight: [null, balanced]
    fixed:
      solver: lbfgs
      max_iter: 2000
      random_state: 20250714
    tunable: true
    threshold_rule: inner_oof_max_youden_j

  hist_gradient_boosting:
    role: exploratory
    class: sklearn.ensemble.HistGradientBoostingClassifier
    pipeline:
      - {class: sklearn.impute.SimpleImputer, params: {strategy: median}}
      - {class: sklearn.ensemble.HistGradientBoostingClassifier,
         params: {random_state: 20250714, early_stopping: false}}
    param_grid:
      histgradientboostingclassifier__learning_rate: [0.05, 0.10]
      histgradientboostingclassifier__max_leaf_nodes: [15, 31]
    fixed:
      random_state: 20250714
      early_stopping: false
      l2_regularization: 0.0
      loss: log_loss
    sample_weight_from: train_labels_only
    tunable: true
    threshold_rule: inner_oof_max_youden_j

# ---------------------------------------------------------------------------
# Inner model-selection rule (identical to Stage 7). Each (feature set x model)
# selects INDEPENDENTLY on the frozen inner folds, using the SAME rule.
# ---------------------------------------------------------------------------
selection:
  primary_score: average_precision
  tie_break_order:
    - higher_auroc
    - simpler_candidate
  average_precision_tolerance: 1.0e-9
  simpler_candidate_order: ascending_grid_index
  record_all_candidates: true
  refit_on_full_outer_train: true
  predict_outer_test_once: true
  per_feature_set_independent: true
  no_outer_test_selection: true

# ---------------------------------------------------------------------------
# Threshold rule (for threshold-dependent metrics only; identical to Stage 7).
# ---------------------------------------------------------------------------
threshold:
  data_driven_rule: inner_oof_max_youden_j
  tie_break: lowest_probability_then_grid_order
  fit_from: inner_oof_validation_predictions
  never_fit_from: outer_test
  never_post_calibrate_on_outer_test: true

# ---------------------------------------------------------------------------
# Evaluation, aggregation, uncertainty.
# ---------------------------------------------------------------------------
evaluation:
  pooled_oof: true
  paired_same_window: true               # core/enhanced OOF joinable per window
  threshold_free_metrics: [auroc, auprc, brier, log_loss]
  threshold_based_metrics: [sensitivity, specificity, precision, f1, balanced_accuracy, confusion_matrix]
  single_class_policy: na_with_reason
  main_comparison:
    model: logistic_regression
    delta: airflow_enhanced_minus_core_restricted
    direction: enhanced_minus_core
  bootstrap:
    enabled: true
    kind: paired_patient_cluster        # resample PATIENTS once; bring BOTH feature sets' OOF
    unit: patient
    n_resamples: 1000
    seed: 20250714
    resample_bring_all_windows: true
    skip_single_class_resamples: true
    report_skipped_count: true
    ci_method: percentile
    ci_level: 0.95
    apply_to: [logistic_regression]      # primary model only
    forbid_window_iid: true
    forbid_cross_cohort_pairing: true
    threshold_free_delta_metrics: [auroc, auprc, brier]
    threshold_based_delta_metrics: [sensitivity, specificity, f1, balanced_accuracy]
  calibration:
    report_raw_brier_logloss: true
    claim_calibrated: false              # probabilities are RAW, NOT calibrated
    forbid_outer_test_post_calibration: true
  figures:
    max_count: 5
    requested: [paired_oof_roc_pr, primary_gain_bootstrap, per_fold_deltas, calibration, cohort_flow]
    calibration_bins: 10
    mandatory_disclaimers:
      - "internal patient-level cross-validation on the 34-patient airflow sub-cohort"
      - "paired within-cohort airflow increment; NOT a gain over the 50-patient main cohort"
      - "not for clinical deployment"

# ---------------------------------------------------------------------------
# Output isolation / immutability (mirror prior stages).
# ---------------------------------------------------------------------------
output:
  run_id_prefix: stage8-airflow-incremental-
  run_dir_isolated: true
  mirror_on_success:
    - {src: models/runs/<run_id>, latest: models/LATEST_RUN.txt}
    - {src: results/runs/<run_id>, latest: results/LATEST_RUN.txt}
  snapshot_raw_before_after: true
  historical_products_unchanged: true
  read_wav_forbidden: true
  audio_products_forbidden: true
  airflow_only_in_enhanced: true         # airflow never enters core_restricted
  path_purity_forbidden_tokens: [pytest, Temp, AppData]
  oof_pseudonymize: true
  oof_forbidden: [feature_values, raw_csv_values, absolute_paths, audio, identifiable_info]
