# Conda environment for the psg-audio-benchmark code release.
#
# HONESTY NOTE — what this file is and is NOT:
#   * It is a CONVENIENCE environment with RANGE constraints. It is NOT a
#     build-locked reproduction of the verified environment: conda builds of
#     the same package version can differ from pip wheels (notably
#     matplotlib's bundled FreeType, which shifts figure text metrics; see
#     docs/REPRODUCTION_GUIDE.md A2).
#   * The authoritative exact versions are the pip pins in requirements.txt
#     / requirements-dev.txt, verified on Windows 10, CPython 3.13.9.
#   * VERIFIED INTERPRETER: Python 3.13 only. The pinned NumPy (2.3.5)
#     requires Python >= 3.11, so Python 3.10 is NOT supported by the exact
#     pins; 3.11/3.12 fall inside the ranges below but were NOT tested for
#     this release — numeric results are expected to reproduce, byte-level
#     figure output is not guaranteed outside the verified environment.
#
#   conda env create -f environment.yml
#   conda activate psg_audio_benchmark
#   pip install -e .                    # REQUIRED (package + CLI)
#   pip install -r requirements-dev.txt # exact verified pins + pytest
name: psg_audio_benchmark
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy>=1.24
  - pandas>=2.0
  - pyarrow>=14.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pip>=23.0
  - pip:
      - pytest>=7.0
      # optional, only for 7z staged archives / audio metadata probing:
      # - py7zr>=0.20
      # - soundfile>=0.12
